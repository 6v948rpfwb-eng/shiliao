<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾料 — 资料收录与检索</title>
<style>
  :root {
    --bg: #fbfaf7; --card: #fff; --ink: #1f2328; --muted: #6b7280;
    --line: #e6e2da; --accent: #2f6f5e; --accent-soft: #e6f1ec; --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 -apple-system, "Hiragino Sans GB", "PingFang SC", sans-serif; }
  header { padding: 22px 24px 10px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=text], select, textarea {
    font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; }
  button.plain { background: #fff; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 16px; }
  .hit { padding: 12px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .hit:last-child { border-bottom: 0; }
  .hit:hover { background: #faf9f6; }
  .hit .t { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .snip { color: #4b5563; font-size: 13.5px; margin-top: 4px; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 1px 9px; font-size: 12px; margin-right: 6px; }
  .doc h1, .doc h2, .doc h3 { line-height: 1.35; }
  .doc pre { background: #f6f5f2; padding: 12px; border-radius: 8px; overflow: auto; }
  .doc code { background: #f2f1ed; padding: 1px 5px; border-radius: 4px; }
  .doc table { border-collapse: collapse; margin: 10px 0; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 5px 10px; }
  .muted { color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin-top: 14px; }
  .tabs button { background: #fff; color: var(--muted); border-color: var(--line); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .msg { font-size: 13px; margin-top: 8px; }
  .ok { color: var(--accent); }
  .bad { color: var(--warn); }
</style>
</head>
<body>
<header class="wrap">
  <h1>拾料</h1>
  <div class="sub">把网页和论文收进本地库，能搜、能读、能存成 Markdown — 资料是数据，代码是引擎</div>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="tab-search" class="on">检索</button>
    <button id="tab-add">收录</button>
    <button id="tab-arxiv">论文</button>
  </div>

  <section id="panel-search" class="card">
    <div class="row">
      <input id="q" type="text" placeholder="搜关键词，中文按两个字一组切" style="flex:1;min-width:240px">
      <button id="go">搜索</button>
      <button id="reload" class="plain">列出全部</button>
    </div>
    <div id="hits"></div>
  </section>

  <section id="panel-add" class="card" hidden>
    <div class="row">
      <input id="url" type="text" placeholder="粘贴网址，回车收录" style="flex:1;min-width:300px">
      <select id="kind">
        <option value="article">文章</option>
        <option value="exam">试卷</option>
        <option value="paper">论文</option>
        <option value="note">笔记</option>
      </select>
      <button id="addurl">收录网址</button>
    </div>
    <div class="msg muted">抓不到的站（要登录、要付费的）用下面的手贴框：把正文复制进来，标题自己起。</div>
    <div class="row" style="margin-top:12px">
      <input id="title" type="text" placeholder="标题" style="flex:1;min-width:200px">
      <input id="source" type="text" placeholder="来源（可留空）" style="flex:1;min-width:200px">
    </div>
    <textarea id="body" rows="6" placeholder="把正文粘贴到这里（支持 Markdown）" style="width:100%;margin-top:10px"></textarea>
    <div class="row" style="margin-top:10px">
      <input id="tags" type="text" placeholder="标签，逗号分隔" style="flex:1">
      <button id="addtext">存进资料库</button>
    </div>
    <div id="addmsg" class="msg"></div>
  </section>

  <section id="panel-arxiv" class="card" hidden>
    <div class="row">
      <input id="aq" type="text" placeholder="arXiv 关键词，例如 world model" style="flex:1;min-width:260px">
      <button id="asearch">搜论文</button>
    </div>
    <div id="ares"></div>
  </section>

  <section id="reader" class="card doc" hidden></section>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
